[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
runOnSave = false

[browser]
gatherUsageStats = false

# ---------- Tema (comum aos dois modos) ----------
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
metricValueFontSize = "1.65rem"
chartCategoricalColors = ["#3b82f6", "#8b5cf6", "#06b6d4", "#f59e0b", "#10b981", "#ec4899", "#64748b", "#ef4444"]

# ---------- Tema claro ----------
[theme.light]
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef2f7"
textColor = "#0f172a"
borderColor = "#dbe3ee"
linkColor = "#2563eb"

[theme.light.sidebar]
backgroundColor = "#eef2f7"

# ---------- Tema escuro ----------
[theme.dark]
primaryColor = "#6366f1"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"
linkColor = "#a78bfa"

[theme.dark.sidebar]
backgroundColor = "#111c33"
